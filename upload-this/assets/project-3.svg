<svg xmlns="http://www.w3.org/2000/svg" width="380" height="214" viewBox="0 0 380 214" role="img" aria-label="Project: Digital Literacy Project">
<defs><style>@keyframes run{to{stroke-dashoffset:-1172}}.run{animation:run 5s linear infinite}
@keyframes sh{0%,55%{transform:translateX(-160px) skewX(-20deg)}100%{transform:translateX(540px) skewX(-20deg)}}.sh{animation:sh 5s ease-in-out infinite;animation-delay:1.6s}
@keyframes bob{50%{transform:translate(4px,-4px)}}.ar{animation:bob 1.6s ease-in-out infinite;font:700 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#f472b6}
@keyframes fl{50%{transform:translateY(-10px)}}.fl{animation:fl 4s ease-in-out infinite}
.n{font:800 13px Consolas, 'Courier New', Menlo, monospace;fill:#f472b6}.h{font:700 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#e6edf7}.d{font:14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#8b9ab8}.tg{font:600 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#e6edf7}</style><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="190" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="380 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<clipPath id="c"><rect x="2" y="2" width="376" height="210" rx="18"/></clipPath>
<linearGradient id="s"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="o"><stop offset="0" stop-color="#f472b6" stop-opacity=".35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient></defs>
<rect x="2" y="2" width="376" height="210" rx="18" fill="#0f1630" stroke="#222c55"/>
<g clip-path="url(#c)"><circle class="fl" cx="340" cy="40" r="90" fill="url(#o)"/>
<rect class="sh" x="0" y="0" width="90" height="214" fill="url(#s)"/></g>
<rect class="run" x="2" y="2" width="376" height="210" rx="18" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="150 1022"/>
