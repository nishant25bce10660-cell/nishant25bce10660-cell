<text class="h" x="26" y="80">Digital Literacy Project</text><text class="d" x="26" y="104">Making everyday digital skills</text><text class="d" x="26" y="126">simple to learn and use.</text><rect x="26" y="162" width="86.8" height="26" rx="13" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".6"/><text class="tg" x="69.4" y="179.5" text-anchor="middle">Education</text><rect x="120.8" y="162" width="43.6" height="26" rx="13" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".6"/><text class="tg" x="142.6" y="179.5" text-anchor="middle">Web</text></svg>