<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" role="img" aria-label="Tech stack orbiting around a glowing core">
<defs><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes unspin{to{transform:rotate(-360deg)}}
.ring{transform-origin:280px 280px;animation:spin 90s linear infinite}
.core{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 3s ease-out infinite}
@keyframes halo{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.ct{font:700 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#fff}.lb{font:600 12.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#e6edf7}</style>
<radialGradient id="cg"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></radialGradient>
<radialGradient id="bgo"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<filter id="g"><feGaussianBlur stdDeviation="6"/></filter></defs>
<circle cx="280" cy="280" r="280" fill="url(#bgo)"/><circle class="ring" cx="280" cy="280" r="92" fill="none" stroke="#222c55" stroke-dasharray="3 9" stroke-width="1.5"/><circle class="ring" cx="280" cy="280" r="152" fill="none" stroke="#222c55" stroke-dasharray="3 9" stroke-width="1.5"/><circle class="ring" cx="280" cy="280" r="206" fill="none" stroke="#222c55" stroke-dasharray="3 9" stroke-width="1.5"/>
<circle class="halo" cx="280" cy="280" r="42" fill="none" stroke="#22d3ee" stroke-width="2"/>
<circle class="core" cx="280" cy="280" r="44" fill="url(#cg)" filter="url(#g)" opacity=".7"/>
<circle cx="280" cy="280" r="40" fill="url(#cg)"/>
