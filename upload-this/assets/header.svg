.nm{font:800 78px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;animation:rise 1.1s .35s both}
.glow{opacity:.55;animation:rise 1.1s .35s both,pg 3.5s 1.5s ease-in-out infinite}
@keyframes pg{50%{opacity:.9}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.role{font:600 29px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#e6edf7;opacity:0;animation-name:role;animation-iteration-count:infinite;animation-timing-function:ease}
@keyframes role{0%{opacity:0;transform:translateY(16px)}3.0%{opacity:1;transform:none}22.0%{opacity:1;transform:none}25.0%{opacity:0;transform:translateY(-16px)}100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:center;animation:bar 2.4s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleX(.35);opacity:.6}50%{transform:scaleX(1);opacity:1}}
</style>
