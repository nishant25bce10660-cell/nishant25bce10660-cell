name: Update animated profile cards

'on':
  schedule:
    # Daily at 00:17 UTC (05:47 India Standard Time).
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "profile.json"
      - "scripts/generate_profile_cards.py"
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font subsetting tools
        run: python -m pip install --upgrade "fonttools[woff]"

      - name: Fetch contribution calendar
        env:
          # PROFILE_TOKEN is optional. Without it, use the repo-scoped token
          # and query public contributions only.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          FROM_DATE="$(date -u -d '370 days ago' +'%Y-%m-%dT00:00:00Z')"
          TO_DATE="$(date -u +'%Y-%m-%dT23:59:59Z')"

          INCLUDE_PRIVATE=false
          if [[ -n "${PROFILE_TOKEN:-}" ]]; then
            INCLUDE_PRIVATE=true
          fi

          gh api graphql \
            -F login="${GITHUB_REPOSITORY_OWNER}" \
            -F from="${FROM_DATE}" \
            -F to="${TO_DATE}" \
            -F includePrivate="${INCLUDE_PRIVATE}" \
            -f query='query($login: String!, $from: DateTime!, $to: DateTime!, $includePrivate: Boolean!) {
              user(login: $login) {
                contributionsCollection(from: $from, to: $to, includePrivateContributions: $includePrivate) {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        contributionCount
                        date
                        weekday
                      }
                    }
                  }
                }
              }
            }' > data/contributions.json

          # Fail here with a clear message if GraphQL returned errors or no user.
          if ! jq -e '.data.user.contributionsCollection.contributionCalendar.weeks | type == "array"' data/contributions.json >/dev/null; then
            echo "GitHub GraphQL did not return a contribution calendar. Response:"
            cat data/contributions.json
            exit 1
          fi

      - name: Render SVG cards
        run: python scripts/generate_profile_cards.py

      - name: Commit refreshed data and cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          if git diff --cached --quiet; then
            echo "No profile-card changes to commit."
          else
            git commit -m "chore: refresh animated profile cards"
            git push
          fi
