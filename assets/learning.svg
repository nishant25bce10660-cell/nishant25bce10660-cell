<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="262" viewBox="0 0 1000 262" role="img" aria-label="Animated progress bars for current learning focus">
<defs><style>@keyframes gr{0%{transform:scaleX(0)}22%,90%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
.fill{transform-box:fill-box;transform-origin:left center;animation:gr 7s cubic-bezier(.2,.8,.2,1) infinite}
